server:
  port: 8080

spring:
  application:
    name: TripMate
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: jdbc:mysql://localhost:3306/tripmate?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf-8
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 1
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          time-between-eviction-runs: 10s
  # ═══ DeepSeek AI ═══
  ai:
    openai:
      #api-key: ${DEEPSEEK_API_KEY}
      api-key: sk-4766d8be99254f6ab4c589bfe04a8d39
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-v4-flash
          temperature: 0.7
          max-tokens: 4096

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: TripMateSecretKeyForJWT2026MustBeAtLeast256BitsLong!!
  expiration: 604800000

baidu:
  maps:
    ak: iWlCciJcNDLAB9ripj8HbQHVLF9lgYGd
